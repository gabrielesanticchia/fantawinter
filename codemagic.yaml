workflows:
  ios-release:
    name: Fantawinter iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Build iOS release
        script: flutter build ios --release --no-codesign
      - name: Package iOS app
        script: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/Runner.app.zip
    artifacts:
      - build/ios/Runner.app.zip
